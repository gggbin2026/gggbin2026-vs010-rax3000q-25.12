# ═══════════════════════════════════════════════════════════════════════
# 第 41 次 · QSDK 12.2「好固件」离线取证真值（2026-11-24）
#   来源：gggbin2026/Actions-OpenWrt-RAX3000Q-VS010-WDS
#         /3000Q-VS010-固件/ 下两个 27 MB factory.bin（用户已上传 GitHub）
#   方法：UBI 镜像 → vol0(FIT) + vol1(squashfs rootfs)；不依赖设备、不联网
#   ⚠ 全部为【只读证据】。没有任何 .ko / FW / BDF 被复制进编译树。
# ═══════════════════════════════════════════════════════════════════════
SOURCE_REPO=gggbin2026/Actions-OpenWrt-RAX3000Q-VS010-WDS @ master
SOURCE_DIR=3000Q-VS010-固件/
SOURCE_VS010=Nwrt-QSDK12.2-2024-04-16-ipq50xx-ipq50xx_32-cucc_vs010-squashfs-nand-factory.bin
SOURCE_RAX3000Q=Nwrt-QSDK12.2-2024-04-16-ipq50xx-ipq50xx_32-cmcc_rax3000qy-squashfs-nand-factory.bin
SOURCE_SIZE=27394048 B（两个都是）· UBI image version 1
UBI_LAYOUT=PEB 0x20000 / VID @0x800 / DATA @0x1000 / LEB 0x1F000 / 209 PEB / 卷表 kernel,rootfs,rootfs_data
UBI_VOL0=FIT：/images/kernel@1 = ARM OpenWrt Linux-5.4.213（gzip）；/images/fdt@1 = 未压缩 dtb
UBI_VOL1=squashfs rootfs，2695(rax3000q) / 2699(vs010) 条目
UBI_VOL2=rootfs_data（空）

# ── 身份 ──────────────────────────────────────────────────────────
KERNEL=5.4.213（FIT description 实证，不是推测）
DISTRO=OpenWrt 19.07-SNAPSHOT, r0-f3013a33b（/etc/banner）
QSDK=12.2（固件文件名）
WIFI_FW_VERSION=WLAN.HK.2.8-01492-QCAHKSWPL_SILICONZ-1 v1（lib/firmware/IPQ5018/fw_version.txt）
WIFI_FW_BUILD=2023-01-27 19:35（实机 dmesg Target capability）
FDT_VS010=ARM OpenWrt cucc_vs010 device tree blob（43140 B，297 节点）
FDT_RAX3000Q=ARM OpenWrt cmcc_rax3000qy device tree blob（43778 B）

# ── 三套内核（这是「.ko 不能搬」的硬证据）──────────────────────────
K_OEM_GOOD=5.4.213 / QSDK 12.2 / NWRT 2024-04-16  ← 本次解出的「好固件」
K_OEM_OLD=4.4.60 / QSDK 10.4 / Chaos Calmer 1.0.1 ← oem_extract/rootfs.ubi（老仓库第40次解过）
K_OLDREPO=5.4.164 / NHSS.11.5 / QSDK 11.5        ← 老仓库 kkstone 树
K_NEWREPO=6.12.x / OpenWrt 25.12 + NSS / 主线 ath11k + mac80211 ← 本仓
VERDICT_KO=vermagic / 导出符号 / cfg80211 ABI 全不匹配；闭源 qca-wifi 与 ath11k+mac80211 互斥 → 拷 .ko 必失败

# ── 无线：真实 DTB 节点（★ 本次首次从好固件拿到）──────────────────
WIFI_COMPAT_2G=qcom,cnss-qca5018 / qcom,ipq5018-wifi（/soc/wifi@c000000）
WIFI_COMPAT_5G=qcom,cnss-qcn6122 / qcom,cnss-qcn9100（VS010）或 qcom,qcn6122-wifi（RAX3000Q）
WIFI_BOARD_ID_VS010_2G=0x10（16）  → bdwlan.b10
WIFI_BOARD_ID_VS010_5G=0x60（96）  → bdwlan.b60
WIFI_BOARD_ID_RAX3000Q_2G=0x24（36）  ★ 与 VS010 不同
WIFI_BOARD_ID_RAX3000Q_5G=0x60（96）
WIFI_BDF_ADDR_2G=0x4C400000（保留内存 /reserved-memory/q6_ipq5018_data@4C400000）
WIFI_BDF_ADDR_5G=0x4D300000（保留内存 /reserved-memory/q6_qcn6122_data1@4D300000）
WIFI_CALDB_ADDR=0（两台都是）/ WIFI_CALDB_SIZE=0 → DTS 级印证 dmesg「Caldata not present」
WIFI_TGT_MEM_MODE=2（闭源 cnss2；★ 不能抄进主线 ath11k DTS，本仓为 1）
WIFI_MULTIPD_ARCH=存在（q6v5_wcss_userpd1 / userpd2，多 PD 架构）
WIFI_RPROC=41 / 42，mem-region 36 / 38
WIFI_DISABLED_NODES=wifi2(qcn6122) / wifi3-5(qcn9000,qcn9224) 全 status=disabled
BDF_DNLD_METHOD=1（QMI WLFW 从 rootfs /lib/firmware 下发）
BDF_LOAD_LOG=Downloading BDF: IPQ5018/bdwlan.b10 / qcn6122/bdwlan.b60，各 131072 B
BDF_VER_LOG=BDF version: 1 CAL version: 0 Status: 0

# ── ★ 第 41 次实证纠正（推翻第 40 次的一句断言）────────────────────
#   第 40 次只看到 dmesg 的「文件名 + 大小」，据旧档案断言
#   「bdwlan.b10/b60 的 MD5 == 本仓模板 BDF」。本次真解包后发现**不成立**：
BDF_MD5_VS010_2G=4ce1ecfcca3aea1e9df230d192199690
BDF_MD5_VS010_5G=80badcdda4502943cf89ee416cd288ca
BDF_MD5_RAX3000Q_2G=4b9aba89839ca7af4b32d932e6e58df0
BDF_MD5_RAX3000Q_5G=e43c4cf0d1ca1d86003992837ac5aed6
BDF_MD5_TEMPLATE_2G=c7d89771464322ea39ca290249295af9（vs010/bdf/board-cucc_vs010.ipq5018，来源未实证）
BDF_MD5_TEMPLATE_5G=0aadbd42dc960aefdffe09177dd275b9（vs010/bdf/board-cucc_vs010.qcn6122）
BDF_MD5_OLD_4_4_60_2G=12f3d732bc8d98c0e688b00c3f0fd887
BDF_MD5_OLD_4_4_60_5G=6b97dd3de198f34dcaf963ff6b68929a
BDF_CORRECTION=好固件 BDF ≠ 模板 BDF ≠ 4.4.60 BDF ≠ ART 切片；且两台互不相同。
   能确定的只有「加载了 bdwlan.b10 / bdwlan.b60、不加载独立 caldata」；
   模板 BDF 的等价性没有证据，默认不进固件反而更安全。
BDF_EXTRACT_ARCHIVE=art/oem-qsdk-bdf/（4 个 128 KB 单 BDF + regdb.bin + fw_version.txt，只读存档）
BDF_USABLE_IN_NEWREPO=0（QSDK cnss2 单 BDF ≠ 主线 ath11k 的 board-2.bin 容器；跨栈、跨机型都不能用）

# ── 无线驱动 / 固件（存在，但不可迁移）─────────────────────────────
KO_WIFI=qca_ol / umac / wifi_3_0 / qdf / ath_pktlog / monitor / mem_manager / ipq_cnss2 / cfg80211
KO_NO_MAC80211=无 mac80211.ko、无 ath11k.ko（lsmod 与 /lib/modules 双证）
KO_TOTAL=160（vs010 /lib/modules 条目）
WIFI_FW_FILES=IPQ5018/{Data.msc(719950), q6_fw.b00..b26 + flist + mdt, m3_fw.b00..b02 + flist + mdt,
              bdwlan.b10/.b20/.b21/.b22/.b23/.b24/.bin, regdb.bin(24278), fw_ini_cfg.bin(203),
              firmware_rdp_feature.ini(3931), firmware_rdp_feature_512P.ini} +
              IPQ5018/qcn6122/{Data.msc(735471), bdwlan.b50/.b60/.b90/.bb0/.bin, m3_fw.*, regdb.bin}
REGDB_MD5=a091952b4bb7...（两台、两个目录共 4 份完全相同，24278 B）
WIFI_FW_USABLE=0（主线 ath11k 用 amss.bin / m3.bin / board-2.bin，格式与 WLAN.HK 分支都不同）

# ── 有线：真实 DTB 拓扑 ────────────────────────────────────────────
ETH_COMPAT_SWITCH=qcom,ess-switch-ipq50xx（/soc/ess-instance/ess-switch@0x39c00000）
ETH_COMPAT_QCA83XX=qcom,ess-switch-qca83xx（/soc/ess-instance/ess-switch1@1）
ETH_GMAC_CLOCKS=gmac0/gmac1 两套独立 cfg/sys/ptp clk + nss_port1/port2 rx/tx clk
ETH_DP1=/soc/dp1 compatible=qcom,nss-dp  → ethernet0 别名
ETH_DP2=/soc/dp2 compatible=qcom,nss-dp  → ethernet1 别名
ETH_ALIASES=ethernet0 = "/soc/dp1"; ethernet1 = "/soc/dp2"
ETH_TOPOLOGY=两个独立 GMAC 各自 CPU 口，qca-ssdk + swconfig（非 DSA）；被加速流量不经过 Linux 网桥
NSS_NODE=/soc/nss@40000000 compatible=qcom,nss；/reserved-memory/nss@40000000
NSS_COMMON=/soc/nss-common compatible=qcom,nss-common；/soc/nss-dp-common compatible=qcom,nss-dp-common
NSS_CRYPTO=/soc/qcom,nss_crypto compatible=qcom,nss-crypto
BOARD_D_02_NETWORK_VS010=cucc,vs010 → ucidef_set_interfaces_lan_wan "eth1" "eth0"（无 switch）
BOARD_D_02_NETWORK_RAX3000Q=cmcc,rax3000qy → ucidef_add_switch "switch1" "5u@eth0" "6u@eth1" "2:lan:1" "3:lan:2" "4:lan:3" "1:wan"
BOARD_D_02_NETWORK_MD5=d9ec50437704（两台 rootfs 里逐字节相同，靠 board_name 分支）

# ── 加速配置（运行期参数，可迁移的是「口径」不是二进制）──────────────
ECM_CONFIG=/etc/config/ecm → config ecm 'global' / option acceleration_engine 'auto'
ECM_FRONT_END_MAP=auto=0 / nss=1 / sfe=2 / ppe=3 / nss-sfe=4 / ppe-sfe=5（init.d/qca-nss-ecm get_front_end_mode）
ECM_SUPPORT_BRIDGE=检查 /sys/kernel/debug/ecm/ecm_nss_ipv4 | ecm_sfe_ipv4 | ecm_ppe_ipv4
NSS_CONFIG=/etc/config/nss → qca_nss_0 / qca_nss_1 + config general / option enable_rps '1'
NSS_RPS=irq nss_queue1→CPU mask 2 / queue2→4 / queue3→8；sysctl dev.nss.rps.enable=1（init.d/qca-nss-drv）
QCACFG80211=/etc/config/qcacfg80211 → option enable '1'
CNSS_DIAG=/etc/config/cnss_diag → 全 0（不抓 diag）
INITD_ORDER=wifi_fw_mount(00) → qca-ssdk(16) → qca-nss-ecm(19/26) → cnss_diag(19) → qca-nss-drv(70) → wifi_fw_done(96)
MODULES_D=30-qca-ssdk-nohnat / 31-qca-nss-dp / 32-qca-nss-drv / 51-qca-nss-drv-pppoe / 52-qca-mcs
KO_NSS=qca-nss-drv / qca-nss-dp / qca-ssdk / ecm / ecm_ae_select / qca-mcs / qca-nss-macsec / qca-nss-pppoe / hyfi-bridging
FIREWALL_ECM=iptables -A FORWARD -m physdev --physdev-is-bridged -j ACCEPT；zone_wan_forward 前插 RATE-LIMIT 1000/sec burst 1000
HOTPLUG_NSS_FW=/etc/hotplug.d/firmware/10-qca-nss-fw（select_nss_fw，按 uname -r 分支）
HOTPLUG_WIFI_FW=/etc/hotplug.d/firmware/11-wifi-fw（mount_wifi_fw "IPQ5018" 后 load_bin）
RC_LOCAL=sleep 10; wifi up
WIFI_FW_MOUNT=把 /lib/firmware/IPQ5018/WIFI_FW 挂到 squashfs 分区并软链出 /lib/firmware/{IPQ5018,qcn6122}/*

# ── 结论 ──────────────────────────────────────────────────────────
EXTRACTABLE_FILES=能提取：4 份 BDF / regdb.bin / fw_version.txt / 全部 .ko / 全部 WiFi FW / 全部脚本与 DTB
PORTABLE_BINARIES=0（.ko 跨 5.4.213→6.12 必挂；WiFi FW 格式/分支不同；单 BDF 不是 ath11k 容器）
PORTABLE_KNOWLEDGE=1（ECM→NSS 卸载路径、qca-ssdk 双 GMAC、wifi_offload、判速看 eth0/eth1+NSS debugfs、不加载 caldata、RPS 绑核口径）
ALREADY_IN_NEWREPO=baseline.env 的 REF_PZL8_* 口径 + wifi-fullspeed.sh + NSS FW 12.5 优先 + ECM→NSS 双射频卸载 + CN/ch36/HE160/本机 BDF/256M LOW + 纯二层桥判速提示
REAL_FULLSPEED_PATH=① 直接用 NWRT 官方固件；② 取得 QSDK 12.2 OEM 授权换 target 重编；③ 在 6.12 主线继续按 NSS/ECM 口径调（不塞 5.4 闭源件）
VERIFIED=0（好固件闭源 qca_ol/umac/ipq_cnss2，本仓主线 ath11k；驱动栈不兼容，任何搬文件都修不好）
