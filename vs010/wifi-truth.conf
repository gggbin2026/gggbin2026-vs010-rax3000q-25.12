#   2026-11-23 用户从「无线 / 有线都正常」的 旧基线镜像（命名已废弃，仅作 BDF 溯源）
#   cucc_vs010 固件上采集了完整串口日志，实证如下：
#
#     好固件无线栈 = 闭源 qca-wifi
#       qca_ol / umac / wifi_3_0 / qdf / ath_pktlog / monitor
#       + ipq_cnss2 + mem_manager + QMI WLFW
#       lsmod 里【没有 ath11k、没有 mac80211】
#     本仓无线栈 = 开源 ath11k（QSDK 21.02 分支）
#       kmod-ath11k + ath11k-firmware-ipq5018 / qcn6122 + board-2.bin
#
#   → 【两套驱动栈互不兼容】。VS010 无线完全不注册的根因是
#     「本仓没有好固件那套闭源驱动 + 固件加载链」，不是 BDF 数值、
#     不是 ART 切片、不是 bdf-addr 地址、不是 DDR 搬运、不是 wifi_fw 分区。
#     改 DTS 数值永远修不好，这一点必须认账。
#
#   ★ 下面 8 个数值仍然保留（三源已实证、且对 ath11k 路径是自洽的），
#     但 VERIFIED 保持 0 的理由变成：【驱动栈不兼容尚未解决】。
#     见下方 ROOT_CAUSE / EVIDENCE_LIVE_* / EVIDENCE_GAP_RESOLVED_*。
#
# ★ 第 26 次校准结论（重要，别再当成「推断值」）：
#   下面 8 个数值【已被三源交叉验证实证】，不是猜的：
#     ① vs010/ipq5018-vs010-nwrt-dump.dts（54247B，实物 /sys/firmware/fdt 反编译）
#     ② vs010_fdt/roundtrip.dts（73108B，同一份 fdt 的另一轮反编译，独立格式）
#     ③ 沙盒 OEM 解包资产 oem_extract/{bdwlan.bin,qcn6102_bdwlan.bin}（128KB 原厂 BDF，
#        MD5 与本仓 vs010/bdf/ 两个文件逐字节一致）
#   三处都是 board_id 0x10/0x60、bdf-addr 0x4c400000/0x4d300000、caldb 全 0。
#   → 所以「真值表没填」不是无线不注册的原因；本仓 DTS 数值本来就对。
#
# ★ VERIFIED 保持 0 的理由（第 27 次更新）：
#   数值已实证、BDF 已实证、caldata 结论已实证、ART 分区名已实证，
