OEM_BOOTLOG_MAC_2G=00:25:5C:11:62:74（phy#2，ch13 40MHz 20dBm，Nwrt_2.4G）
OEM_BOOTLOG_MAC_5G=00:03:7F:12:EF:EF（phy#3，ch149 80MHz 27dBm，Nwrt_5G；BDF 占位家族）
OEM_BOOTLOG_FIRMWARE_DIR=/lib/firmware/IPQ5018/bdwlan.b10/.b20/.b21/.b22/.b23/.b24/.bin + /IPQ5018/qcn6122/bdwlan.b50/.b60/.b90/.bb0/.bin

# ⛔ 以下「第 40 次」结论中「MD5 == 模板 BDF」一句已被第 41 次真固件解包推翻，
#    保留仅为留痕；准确结论见文件末尾「第 41 次」段与 vs010/oem-qsdk-truth.conf。
# ★ 第 40 次当时的结论修正（覆盖第 39 次的方向）：
#   bdwlan.b10 / bdwlan.b60 的 MD5 == vs010/bdf/board-cucc_vs010.*（模板 BDF，
#   见 EVIDENCE_BDF_MD5_*），**不等于 ART 切片**（ART_VS010_BDF2G/5G_MD5）。
#   → 好固件加载的是【模板 BDF】，ART 切片根本没被用；Caldata not present 与
#     CAL version 0 双重印证。所以「本机校准」应取模板 BDF，不是 ART 切片。
#   → 上一版允许 ART_CALIBRATION=1 用 ART 切片合成 board-2.bin 是方向错误，
#     会把一份没被验证过的功率表刷进固件。已改为 art/make-board2.py from-oem
#     （board_id 0x10 / 0x60 有实机依据），并在 board-inject.sh 加 ART 切片 MD5 警告。
OEM_BDF_VERDICT=用好固件实证在用的模板 BDF；ART 切片只存档/自检，禁止进固件
OEM_BOARD_ID_FROM_FILENAME=0x10 → qmi-board-id 16；0x60 → qmi-board-id 96（bdwlan.bXX 后缀即 board_id 十六进制）

# U-Boot（ATR文件/ 两份 640KB 镜像 strings）
UBOOT_FLASH_TABLE=F50D1G41LB(2M)（ESMT V1）+ FM25LS01 / FM25LS02BI3（复旦微 V2）都在名称表
UBOOT_NO_BDF=无 bdwlan / cnss2.bdf_* / 4c400000 / 4d300000 字符串 → 无 DDR 搬运参数（GAP_RESOLVED_1 再确认）
UBOOT_FUNCS=board_update_caldata / failsafe_write_art / qpic_nand_read_id_serial 存在
UBOOT_VERDICT=U-Boot 侧已认 FM25LS01 → V2 批次真实存在；Linux 侧 qcom_snand 补丁对 V2 必需（默认仍关，见 patches/README.md）

