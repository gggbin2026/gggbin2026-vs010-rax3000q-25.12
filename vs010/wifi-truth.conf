# ── 三套 DTS 语法对应三套驱动（防「好心改坏」）──
#   QSDK 21.02 kkstone（本仓底座，ath11k QSDK 分支）：qcom,bdf-addr 是【3 元组】
#       <0x4c400000 0x4c400000 0x4c400000> / <0x4d300000 0x4d300000 0x4d300000>
#       → 本仓 ipq5018-vs010.dts 的写法【正确】，不要改成 6 元组！
#   NWRT 实物（QSDK 闭源 cnss2）：6 元组 + mem-region phandle + reserved-memory
#   OpenWrt 25.12 qualcommax（主线 ath11k）：单值 <0x4c400000> / <0x4d100000>
# 证据：沙盒内 ipq5000-rax3000q.dts / 25.12_材料/ipq5018-rax3000q.dts / _dtsapply/ipq5018-vs010.dts 三份写法并列。
