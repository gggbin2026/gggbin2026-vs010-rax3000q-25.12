# ART 真值（离线采集 + 实机日志，只读）—— 2026-11-24
# 来源 A：仓库根目录两份完整 0:ART 分区备份，由 art/collect.sh 复核。
# 来源 B：仓库 ATR文件/VS010文件.txt（好固件实机串口日志，转 UTF-8 存档于 art/oem-bootlog.txt）。
# 来源 C：仓库 ATR文件/ 两份 640KB U-Boot 镜像的 strings。
# 用途：运行期 /usr/sbin/art-check 读同一分区后逐项比对；编译期只决定「不做什么」。
# ⚠ 每台机器独立产线校准，绝不把一机的切片编进另一机的固件。
# ⚠ 这些值默认不参与编译；board-2.bin 只有显式开关才会装配。

ART_VS010_FILE=010-smem_0-ART.bin
ART_VS010_SIZE=1048576
ART_VS010_MD5=e6799786e10756f9622cd7921620ede6
ART_VS010_MAC0=58:95:D8:13:18:EB
ART_VS010_MAC1=58:95:D8:13:18:EA
ART_VS010_MAC2=58:95:D8:13:18:EC
ART_VS010_MAC3=58:95:D8:13:18:ED
ART_VS010_BDF2G_OFF=0x1000
ART_VS010_BDF2G_MD5=26b9b9adeb9aff94fbb83efa3f524dbb
ART_VS010_BDF2G_MAC=58:95:D8:13:18:EE
ART_VS010_BDF5G_OFF=0x26800
ART_VS010_BDF5G_MD5=dcf46e01858ac8bf59ef9053651861bc
ART_VS010_BDF5G_MAC=58:95:D8:13:18:EF
ART_VS010_BDF_MAGIC=01000404
ART_VS010_HEADER=有 4 个连续单播 MAC（ART+0 / +6 / +0xC / +0x12）

ART_RAX3000Q_FILE=RAX3000Q-mtd13-0ART
ART_RAX3000Q_SIZE=1048576
ART_RAX3000Q_MD5=4f6f51ad045e4904c7c46933d4297945
ART_RAX3000Q_HEADER=全 0xFF（MAC 不在这片，不能从 ART+0 取）
ART_RAX3000Q_BDF2G_OFF=0x1000
ART_RAX3000Q_BDF2G_MD5=9a78b59f3a23c1f88b45925b15418850
ART_RAX3000Q_BDF5G_OFF=0x26800
ART_RAX3000Q_BDF5G_MD5=ef733f2c715d519661550dfb0231982a
ART_RAX3000Q_BDF_MAC=00:03:7F:12:34:56（占位，非本机 MAC）
ART_RAX3000Q_BDF_MAGIC=01000404

# 与仓库现有模板 BDF 的差异（vs010/bdf/board-cucc_vs010.*）
#   模板 BDF 的 MAC 是占位 00:03:7F:12:34:56；ART 切片含本机产线数值。
#   VS010  2G 差 1055 B / 5G 差 3013 B
#   RAX3000Q 2G 差  703 B / 5G 差 3077 B
#   两台切片互差：2G 738 B / 5G 2552 B → 校准数值逐台不同，但射频同构。
TEMPLATE_BDF_2G_MD5=c7d89771464322ea39ca290249295af9
TEMPLATE_BDF_5G_MD5=0aadbd42dc960aefdffe09177dd275b9

# ── ★ 实机日志一手结论（2026-11-24 新增，纠正上一版方向）────────────
# 好固件 dmesg：Downloading BDF: IPQ5018/bdwlan.b10, size: 131072
#              Downloading BDF: qcn6122/bdwlan.b60, size: 131072
#              WARN: Caldata not present. Skipping caldata download
#              BDF version: 1 CAL version: 0 Status: 0
# ★ 第 41 次实证纠正：第 40 次断言「bdwlan.b10/b60 的 MD5 == 模板 BDF」不成立。
#   真解开 5.4.213 两个 factory.bin 后发现：好固件 BDF ≠ 模板 BDF ≠ 4.4.60 BDF ≠ ART 切片，
#   且 VS010 与 RAX3000Q 互不相同（四套 MD5 见 vs010/oem-qsdk-truth.conf 与 art/oem-qsdk-bdf/）。
#   dmesg 只给了文件名和 131072 B 大小，从来没给 MD5；模板 BDF 的等价性没有证据。
#   能确定的只有：加载 bdwlan.b10 / bdwlan.b60、Caldata not present、DTB caldb-addr=0 / caldb-size=0。
OEM_BDF_IN_USE=unknown（好固件 BDF 与模板/4.4.60/ART 切片都不同；取证存档见 art/oem-qsdk-bdf/）
OEM_BDF_2G_FILE=IPQ5018/bdwlan.b10（board_id 0x10）
OEM_BDF_5G_FILE=qcn6122/bdwlan.b60（board_id 0x60）
OEM_BDF_SIZE=131072（两个都是；大小一致但内容与模板 BDF 不同）
OEM_CALDATA=Caldata not present（IPQ5018/caldata.bin 与 qcn6122/caldata_1.bin 都跳过）
OEM_BDF_VERSION=1 / CAL_VERSION=0 / STATUS=0
OEM_PLATFORM_NAME=CUCC VS010
OEM_DEVICE_ID_2G=0xfffc（QCA5018） / 0xfffb（QCN6122_1）
OEM_BOARD_ID_TARGET_CAP=0xff（Target capability 字段，不是 bdwlan.bXX 的 board_id）
OEM_BOARD_ID_2G=0x10 → qmi-board-id=16
OEM_BOARD_ID_5G=0x60 → qmi-board-id=96
OEM_BDF_DNLD_METHOD=1（QMI WLFW 从 rootfs /lib/firmware 下发）。★ 两台真实 DTB 里仍有 qcom,bdf-addr=0x4c400000/0x4d300000，那是 cnss2 自己用的保留内存地址；U-Boot 里没有，两者不矛盾
OEM_MEM_MODE=2（闭源 cnss2 的 mem mode；★不要抄进主线 ath11k DTS，本仓 DTS 是 1）
OEM_DRIVER_STACK=qca_ol / umac / wifi_3_0 / ipq_cnss2 / qdf / qca_nss_drv / ecm / qca_ssdk；lsmod 无 ath11k、无 mac80211
OEM_WIFI_MAC_2G=00:25:5C:11:62:74
OEM_WIFI_MAC_5G=00:03:7F:12:EF:EF（BDF 占位 00:03:7F:12:xx:xx 家族，ART 头真 MAC 未被无线用）
OEM_RADIO_2G=ch13 / 40MHz / 20dBm（老固件配置，非最优；本仓用 ch1 HE40）
OEM_RADIO_5G=ch149 / 80MHz / 27dBm（老固件配置；本仓要满速用 ch36 HE160）
OEM_CMDLINE=console=ttyMSM0,115200n8 ubi.mtd=rootfs ... swiotlb=1 coherent_pool=2M（无 cnss2.bdf_*）
OEM_MTD_ART=mtd13: 00100000 "0:ART"；另有 0:APPSBLENV / 0:TRAINING
OEM_REGDB=IPQ5018/regdb.bin 与 qcn6122/regdb.bin，各 24278 B

# ── U-Boot 实证（两份 640KB 镜像，strings）────────────────────────────
UBOOT_VS010_MD5=见 ATR文件/uboot-ipq50xx-cucc_vs010-260816_142236_3011049.bin
UBOOT_RAX3000Q_MD5=见 ATR文件/uboot-ipq50xx-cmcc_rax3000q-260816_142236_3011049.bin
UBOOT_FLASH_NAMES=F50D1G41LB(2M)（ESMT V1）+ FM25LS01 / FM25LS02BI3（复旦微 V2）都在名称表里
UBOOT_NO_BDF_ARGS=无 bdwlan / 无 cnss2.bdf_* / 无 4c400000 / 4d300000 字符串
UBOOT_CALDATA_FUNCS=board_update_caldata / failsafe_write_art / qpic_nand_read_id_serial 存在
UBOOT_BOOTARGS=ubi.mtd=rootfs root=mtd:ubi_rootfs rootfstype=squashfs；loadaddr=0x44000000；fdt_high=0x4A400000
UBOOT_VERDICT=U-Boot 侧已认 FM25LS01 → V2 批次真实存在；Linux 侧 qcom_snand 补丁对 V2 必需（但默认关，见 patches/README.md）

# 默认：固件不引用 ART 校准、不加载 caldata、不自动写 MAC、不打 NAND 补丁。
CALDATA_DEFAULT=off
ART_CALIBRATION_DEFAULT=0
ART_SLICE_IN_FIRMWARE=forbidden（好固件不加载独立 caldata；ART 切片与四套实测 BDF 都不同，未经实证，不进固件）
NAND_PATCH_DEFAULT=0
