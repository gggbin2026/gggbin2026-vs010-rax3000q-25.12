# 第 46 次 · 刷完即成型的业务配置（qsdk-firstboot-config 读取）
# 改这里即可，不用改脚本、不用重编；改完跑 `qsdk-firstboot-config --force`。
# 纯 KEY=VALUE，脚本用 sed 逐项解析，不 source 本文件。

# ── 无线 ──
WIFI_SSID_24=BRIDGE-SETUP
WIFI_SSID_5=WDS_AP
WIFI_KEY=WDS123456

# ── 管理 ──
# root 密码 = admin（官方固件的 /etc/shadow 里 root:: 是空密码，实机已确认）
ROOT_PASSWORD_HASH=$1$QsK9Wd$Kh.6Ulr/GvMk.eGLGzO340
# 【第 52 次】所有设备统一 172.10.10.241 / 255.255.252.0（/22，网络 172.10.8.0）
WDS_AP_IP=172.10.10.241
WDS_STA_IP=172.10.10.241
AP_IP=172.10.10.241
NETMASK=255.255.252.0
# 两台 WDS 同时插同一交换机要错开时：只把 WDS_STA_IP 改成 172.10.10.242 即可
# （qsdk-bridge-role 会读这个键，主端仍用 WDS_AP_IP）。默认全统一 = 用户要求。

# ── 开关（1=做，0=不做）──
DISABLE_FIREWALL=1
DISABLE_IPV6=1
SLIM_SERVICES=1
APPLY_ROLE_IP=1

# ── 网络净化 / 时间（第 51 次）──
APPLY_NET_CLEAN=1
# 只做 NTP 客户端，同步内网两台时间服务器（不对外提供 NTP 服务）
NTP_SERVER_1=192.168.1.254
NTP_SERVER_2=172.10.10.254
