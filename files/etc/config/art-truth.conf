# ── 对老仓库的判决 ──
VERDICT_PROBE=ART 不决定「能不能 probe」；好固件 CAL version=0 照样正常，本仓 PHY 2 个能注册也印证
VERDICT_SIGNAL=ART 影响功率/信号强弱；本仓 5G 若吃不到原厂 BDF 会「能起但弱」，故第 39 次补大写 QCN6122 目录
VERDICT_ROOT_CAUSE=驱动栈不兼容仍是天花板：好固件闭源 qca_ol/umac/wifi_3_0+ipq_cnss2（vermagic 5.4.213 ARMv7），本仓开源 ath11k（5.4.164 NHSS.11.5）
VERDICT_DTS=ART 里没有 board_id / bdf-addr，那两个在 fdt / cmdline；VERIFIED 保持 0，不拿 ART 改 DTS
VERDICT_CALDATA=偏移已实证，但仍默认不切；wifi-art-cal 只提供 status / export 到 /tmp，绝不写 /lib/firmware
ART_TOOL=sh /usr/sbin/wifi-art-cal status
