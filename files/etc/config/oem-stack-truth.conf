SOURCE_REPO=gggbin2026/vs010-rax3000q-openwrt @ a746b33 / oem_extract/rootfs.ubi
SAME_AS=xiangye277/vs010-openwrt @ main（同一份 UBI，逐字节一致）
UBI_SIZE=23724695
UBI_LAYOUT=PEB 131072 / LEB 126976 / min_io 2048 / 181 PEB / 5 卷
UBI_VOL_KERNEL=33 PEB, 4116708B, FIT（ARM OpenWrt Linux-4.4.60 + qcom-ipq50xx-mpxx dtb）
UBI_VOL_WIFI_FW=29 PEB, 3575808B, squashfs xz, 54 inode / 52 文件
UBI_VOL_BT_FW=1 PEB, 18432B, squashfs, 7 inode / 5 文件
UBI_VOL_ROOTFS=116 PEB, 14729216B, squashfs xz, 2164 inode / 1712 文件
UBI_VOL_ROOTFS_DATA=0 PEB（空）
KERNEL=4.4.60
DISTRO=OpenWrt Chaos Calmer 1.0.1 / DISTRIB_TARGET='ipq/ipq50xx'
QSDK=10.4（qca-wifi-hk-fw-hw1-10.4-asic / qca-iface-mgr-10.4 / qca-thermald-10.4）
KO_DIR=/lib/modules/4.4.60
KO_TOTAL=190

# ── 闭源无线栈 .ko（字节数）──
KO_qca_ol=1627576
KO_umac=3610380
KO_wifi_3_0=900996
KO_qdf=157124
KO_ath_pktlog=18552
KO_mem_manager=4876
KO_cfg80211=239652
KO_NOTE=无 mac80211.ko、无 ath11k.ko → 纯闭源 qca-wifi 栈

# ── NSS / 硬件加速 .ko ──
KO_qca_nss_drv=477368
KO_qca_ssdk=542676
KO_ecm=457396
KO_qca_nss_dp=有
KO_qca_mcs=有
KO_hyfi_bridging=107900
KO_qca_nss_pppoe=有
KO_qca_nss_qdisc=有
KO_qca_nss_macsec=有
NSS_FW=/lib/firmware/qca-nss0-retail.bin 761676B

# ── wifi_fw 卷 52 个固件（与 5.4 成功态日志逐字相同）──
FW_bdwlan=bdwlan.b10 / b20 / b21 / b22 / b23 / b24 / bin（各 131072B）
FW_q6=q6_fw.b00 b01 b02 b03 b04 b05 b07 b08 b09 b10 b11 b13 b14 b15 b16 b17 b18 b20 b21 b22 b23 b25 b26 + flist + mdt
FW_m3=m3_fw.b00 b01 b02 + flist + mdt
FW_qcn6122=qcn6122/{bdwlan.b50,b60,b90,bb0,bin, m3_fw.*, qdss_trace_config.bin}
FW_misc=qdss_trace_config.bin / fw_version.txt / firmware_rdp_feature.ini / firmware_rdp_feature_512P.ini
FW_54_ONLY=Data.msc / fw_ini_cfg.bin / regdb.bin（及 qcn6122 三份副本）← 5.4 日志独有，本卷没有
FW_VERDICT=52/58 逐字相同 → 固件族跨 QSDK 版本通用，固件不是瓶颈

# ── bt_fw 卷 ──
BT_FW=image/{bt_fw_patch.mdt,b00,b01,b02,mpnv10.bin}

# ── 用户态工具 / 库 ──
USERSPACE=/usr/sbin/{wifitool,wlanconfig,athstats,athstatsclr,cfg80211tool,cfg80211tool.1,wifistats,cnss_diag,wlanfw-upgrade.sh,qcatestcmd,qca_listen_port,wifi_hw_mode,wifi_try,wifimeshconfig}
LIBS=/usr/lib/{libwlanfw_htt.so,libwlanfw_wmi.so,libwlanif.so,libwifisoncfg.so,libqca_wifison_ext.so,libwifistats.so,libezmmcfwdtblwlan2g.so,libezmmcfwdtblwlan5g.so}
OPKG_PKGS=qca-acfg / qca-cfg80211 / qca-cfg80211tool / qca-cnss-daemon / qca-diag / qca-hostap / qca-hostap-macsec / qca-hostapd-cli / qca-iface-mgr-10.4 / qca-qmi-framework / qca-qrtr / qca-ssdk-shell / qca-thermald-10.4 / qca-wifi-hk-fw-hw1-10.4-asic / qca-wlanfw-upgrade / qca-wpa-supplicant / qca-wpa-cli / qca-wpc / qca-wrapd / wififw_mount_script / kmod-qca-nss-{drv,dp,ecm-standard,macsec,pppoe,qdisc} / kmod-qca-ssdk-nohnat / kmod-qca-mcs / kmod-qca-hyfi-bridge / qca-nss-fw-mp-retail / qca-ezmesh-* / qca-whc-* / hyfi-map / whc-map / jansson / cnssdiag

# ── 关键 init.d（START 顺序）──
INITD=wifi_fw_mount(00) / qca-ssdk(16) / qca-nss-ecm(19) / cnss_diag(19) / qca-nss-drv(70) / wifi_fw_done(96, boot 钩子里挂 WIFI_FW 与 BT_FW) / qca-hostapd / qca-wpa-supplicant / qca-acfg / hyfi-bridging / repacd / lbd / ssid_steering / mcsd / ezmesh / ftm / boot-ftm

# ── 三套内核对照 ──
K_OEM=4.4.60 / QSDK 10.4 / Chaos Calmer 1.0.1     ← 本次解出
K_OURS=5.4.164 / NHSS.11.5 / QSDK 11.5            ← 老仓库 kkstone 树
K_GOOD=5.4.213 / QSDK 12.2 / NWRT 2024-04-16      ← 用户「无线正常」的好固件
USABLE_IN_OURS=0   # vermagic / 内核 ABI / 导出符号 / cfg80211 版本全不匹配；闭源栈与 ath11k+mac80211 互斥

# ── 5.4 好固件拉取实测（第 40 次）──
FETCH_BAIDU=403 policy_default_denied（网关拦截，非链接失效）
FETCH_123PAN=403 policy_default_denied
FETCH_QUARK=403 policy_default_denied
FETCH_HFS=403 policy_default_denied（根 / 路由器目录都拦）
FETCH_GITHUB_vs010_openwrt=404（gggbin2026/vs010-openwrt 不存在）
FETCH_GITHUB_xiangye277=200，但 oem_extract/rootfs.ubi 就是同一份 4.4.60
FETCH_QSDK_SRC=CodeLinaro git.codelinaro.org + repo + AU_LINUX_QSDK_NHSS.QSDK.12.2.R4_TARGET_ALL manifest，需 OEM 授权，GitHub 无公开镜像
FETCH_VERDICT=5.4 / QSDK 12.2 闭源无线驱动【拉不到】

# ── 老仓库缺口 ──
OUR_CONFIG=kmod-ath11k=y + kmod-qca-nss-drv=y + kmod-qca-ssdk-nohnat=y（四份 .config 一致）
OUR_FEEDS=immortalwrt {packages,luci,routing,telephony} @ openwrt-21.02（无 QSDK 闭源 feed）
OUR_GAP=qca_ol/umac/wifi_3_0/qdf + ipq_cnss2 + QMI WLFW + qca-cnss-daemon + qca-qmi-framework + qca-hostap + wifi_fw_mount + qca-wlanfw-upgrade 全缺

