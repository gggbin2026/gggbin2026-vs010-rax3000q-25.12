# WDS/AP（仿UBNT）· 轻量巡检（单常驻 nwrt-tick）
# 单位：轮。1 轮 = TICK_SEC 秒。全部只取数字，非法值回落默认。
ENABLED=1
TICK_SEC=60
NTP_EVERY=5          # 5 轮 = 300 秒校时一次
WDS_EVERY=2          # 2 轮 = 120 秒查一次 WDS 关联
DRYRUN=1             # 1 = 只记日志不动作（出厂默认，最稳）；0 = 允许限频自愈
RELOAD_COOLDOWN=30   # 30 轮 = 30 分钟内最多一次 wifi reload，绝不循环 reload
NTP_SERVER=172.10.10.254
