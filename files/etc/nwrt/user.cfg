# WDS/AP（仿UBNT）· 6.12 用户配置（对齐 5.4 老仓字段，值按主线升级修复）
# 只由 /cgi-bin/luci/admin/nwrt/save 写；权限 600；开机重读。
mode=wds
role=master
peer_ssid=NWRT-WDS
peer_bssid=
peer_key=WDS123456
ssid5=NWRT-WDS
key5=WDS123456
ssid2=NWRT-AP-2G
key2=AP123456
ch5g=36
htmode=HE160
ch24g=1
ht24=HE40
txpower=auto
wmm=1
# 6.12 升级修复：rssi_thr → wifi-device 的 rssi_reject_assoc_rssi（真实 UCI），
# rssi_timeout → rssi_reject_assoc_timeout；AP 模式由 hostapd 生效（WDS 是 STA，不下发）。
# kick_* 是「弱信号剔除」：无主线 UCI，由 nwrt-tick 分频 + iw station del 主动 deauth。
mu_mimo=1
rssi_thr=-85
rssi_timeout=10
kick_enabled=0
kick_rssi=-90
ip=172.10.10.241
mask=255.255.252.0
hostname=NWRT-VS010
stp=1
ntp=172.10.10.254
theme=ubnt
dhcp_enabled=0
dhcp_start=100
dhcp_limit=150
dhcp_lease=12h
