# /etc/bridge.conf —— 网桥状态页配置（2026-11-22 第 7 次更新 · 按 README 重写版）
# 纯 KEY=VALUE，CGI 用 sed 逐项解析，不 source 本文件（更安全）。
# 改完立刻生效，不用重启服务、不用重编。

# 扫描目录。真机就是 /sys/class/net；自检时可指向临时目录做 mock。
BRIDGE_SYSFS=/sys/class/net

# 端口四宫格显示哪些接口（顺序即顺序）。
# ★ 第 46 次实机：官方 5.4.213 的 VAP 是 ath0/ath1，不是 wlan0/wlan1；
#   wifi0/wifi1 是 radio、soc0/1 是内部口，都不该出现在端口卡片里。
#   CGI 会自动把实际存在的 ath*/wlan* 追加到本列表后面，所以这里只写有线口。
PORTS=br-lan eth0 eth1

# WDS 链路接口（5G）。auto = 自动挑 ath1，不存在则取最后一个 ath*/wlan*
WDS_IF=auto

# swconfig 兜底设备。★ 实测本机是 switch1 - QCA AR8337（switch0 是 QCA MP，别写错）
SWITCH_DEV=switch1
SWITCH_TYPE=QCA AR8337

# 页面自动刷新秒数
REFRESH=10

# 管理入口（页面右上角 LuCI 链接用；CGI 也会用 uci 读真实 ipaddr 覆盖）
ADMIN_IP=172.10.10.241
# 【第 52 次】管理网段 /22；所有设备（WDS 主 / WDS 备 / AP）默认统一 .241。
NETMASK=255.255.252.0
# 两台 WDS 同时插同一交换机时，改成 1 → 备端自动让到 172.10.10.242，避免 ARP 冲突。
SPLIT_ROLE_IP=0
STA_IP=172.10.10.242

# 说明：本固件已关 VLAN、eth0+eth1 同进 br-lan 当傻交换。
#       CGI 读的是 CPU 侧 netdev 统计（/sys/class/net/<if>/statistics/*）；
#       交换芯片逐端口计数在 swconfig 机型不可得，页面不会假装显示。
