# ============================================================
# 插件 / 服务冻结基线 · 第 51 次（2026-11-25）· 只增不减
# ============================================================
# 用户口径：「以后插件就以这版为准，不能再减少了，以后只能增加或保持」。
#
# ★ 本文件的铁律：
#   1. 只允许【追加新行】，禁止删除、改名、改值任何已有行。
#   2. 每个条目 = 这版固件必须保留的一项能力；少一项 → verify.sh 直接 FAIL，
#      编译期 gen-config.sh 也会 ::error:: 阻断，不会静默产出缺插件的固件。
#   3. 想加插件 / 服务 / 页面：在对应段【追加】一行即可，verify 会自动识别为
#      「新增（允许）」，不阻断。不需要改本文件的任何旧行。
#   4. 关闭项（防火墙 / IPv6 / 第三方 luci-app-*）不在此清单，另见
#      baseline/插件与服务冻结基线-详细日志.md 的「红线」章节。
#
# 类别说明：
#   [pkg]    编译包 —— 检查 config/{common,themes,<mode>}.seed 里 CONFIG_PACKAGE_<名>=y
#   [global] 全局开关 —— 检查 config/*.seed 里的精确行（=y 或 =n）
#   [initd]  运行期 init.d 服务 —— files/etc/init.d/ 或 files.ap/etc/init.d/
#   [sbin]   运行期 usr/sbin 工具/自愈脚本 —— files/usr/sbin/ 或 files.ap/usr/sbin/
#   [www]    状态页 / CGI —— files/<路径> 或 files.ap/<路径>
#   [uci]    首启 uci-defaults —— files/etc/uci-defaults/ 或 files.ap/etc/uci-defaults/
#   [cfg]    关键 UCI 配置 —— 格式 [cfg]|相对文件|必须包含的固定串
#
# 单数据源：scripts/gen-config.sh 的 REQUIRED_PKGS 直接读本文件 [pkg] 段；
#           scripts/verify.sh 的「第 52 次：冻结基线只增不减」段读全段。
# ============================================================

