# ── [global] 全局开关：4 项（低内存 profile / squashfs / 关 IPv6 / 关 initramfs）──
[global]|CONFIG_ATH11K_MEM_PROFILE_256M=y
[global]|CONFIG_TARGET_ROOTFS_SQUASHFS=y
[global]|CONFIG_TARGET_ROOTFS_INITRAMFS=n
[global]|CONFIG_IPV6=n

