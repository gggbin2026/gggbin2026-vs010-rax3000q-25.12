# ── [cfg] 关键 UCI 配置：12 项（文件 | 必须包含的固定串）──
[cfg]|files/etc/config/wdsdog|option enabled '1'
[cfg]|files/etc/config/wdsdog|option delay '5'
[cfg]|files/etc/config/wdsdog|option max_reboots '3'
[cfg]|files.ap/etc/config/wdsdog|option enabled '0'
[cfg]|files/etc/config/system|option poll_interval '300'
[cfg]|files/etc/config/system|list server '192.168.1.254'
[cfg]|files/etc/config/system|list server '172.10.10.254'
[cfg]|files/etc/config/system|option enable_server '0'
[cfg]|files/etc/config/l2guard|option enabled '1'
[cfg]|files/etc/config/network|option stp '1'
[cfg]|files/etc/config/network|option ipaddr '172.10.10.241'
[cfg]|files/etc/config/network|option netmask '255.255.252.0'
